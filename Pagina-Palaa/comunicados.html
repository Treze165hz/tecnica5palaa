<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todos los Comunicados - E.E.S.T. Nº 5</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <img src="https://tecnica5avellaneda.com.ar/gallery_gen/8f2c31c6bd1bc2e841f3910ff6145657_100x100.png" alt="Escudo EEST N5" class="h-12 w-auto object-contain" />
        <div>
          <span class="font-bold text-slate-900 text-lg block leading-tight">E.E.S.T. Nº 5</span>
          <span class="text-xs text-slate-500 font-medium">Dr. Salvador Debenedetti</span>
        </div>
      </a>
      <nav class="hidden md:flex items-center gap-8">
        <a href="index.html" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition-colors">Inicio</a>
        <a href="comunicados.html" class="text-sm font-semibold text-blue-600">Comunicados</a>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 flex-grow">
    <div class="text-center mb-12">
      <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Cartelera escolar</span>
      <h1 class="text-3xl font-bold text-slate-900 mt-3">Todos los Comunicados</h1>
      <p class="text-slate-600 text-sm mt-2">Historial completo de novedades y anuncios oficiales de la institución.</p>
    </div>

    <div id="comunicados-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <p class="col-span-3 text-center text-slate-400 py-8">Cargando comunicados...</p>
    </div>
  </main>

  <footer class="bg-slate-900 text-slate-400 py-12 border-t border-slate-800 mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-6">
      <p class="text-sm">© 2026 E.E.S.T. Nº 5. Todos los derechos reservados.</p>
      <p class="text-sm font-medium text-slate-400">
        Desarrollado por 
        <a href="https://www.instagram.com/matysoiza" target="_blank" class="font-bold text-blue-400 hover:text-blue-300 transition-colors inline-flex items-center gap-1.5 underline decoration-dotted">Matias Soiza</a>
      </p>
    </div>
  </footer>

  <script type="module">
    import contentful from 'https://cdn.jsdelivr.net/npm/contentful@10.8.0/+esm';
    const SPACE_ID = 'rf2oxbfjllfm';
    const ACCESS_TOKEN = 'mTW77oXSaaooKKzWfQbcaWZ0QScH0BPr4YNojd5wfb0';

    const client = contentful.createClient({ space: SPACE_ID, accessToken: ACCESS_TOKEN });

    function getBadgeStyle(etiqueta) {
      const tag = (etiqueta || '').toLowerCase();
      if (tag.includes('urgente')) return 'bg-red-100 text-red-800 border-red-200';
      if (tag.includes('evento')) return 'bg-green-100 text-green-800 border-green-200';
      if (tag.includes('descargas')) return 'bg-purple-100 text-purple-800 border-purple-200';
      return 'bg-blue-100 text-blue-800 border-blue-200';
    }

    async function cargarTodos() {
      const grid = document.getElementById('comunicados-grid');
      try {
        const response = await client.getEntries({ content_type: 'comunicado', order: '-sys.createdAt' });
        grid.innerHTML = response.items.map(entry => {
          const fields = entry.fields;
          const id = entry.sys.id;
          const titulo = fields.titulo || 'Sin título';
          const extracto = fields.extracto || '';
          const etiqueta = fields.etiqueta || 'Institucional';
          const fecha = fields.fecha || new Date(entry.sys.createdAt).toLocaleDateString('es-AR');
          
          let imgUrl = 'https://via.placeholder.com/600x340?text=E.E.S.T.+N%C2%BA5';
          if (fields.imagen) {
            const asset = Array.isArray(fields.imagen) ? fields.imagen[0] : fields.imagen;
            if (asset?.fields?.file?.url) imgUrl = 'https:' + asset.fields.file.url;
          }

          return `
            <article class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl border border-slate-100 transition-all duration-300 flex flex-col group">
              <div class="aspect-video w-full overflow-hidden bg-slate-100">
                <img src="${imgUrl}" alt="${titulo}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
              </div>
              <div class="p-6 flex flex-col flex-grow">
                <div class="flex items-center gap-2 mb-3">
                  <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full border ${getBadgeStyle(etiqueta)}">${etiqueta}</span>
                  <span class="text-xs text-slate-400">${fecha}</span>
                </div>
                <h3 class="text-xl font-bold text-slate-900 mb-2 line-clamp-2">${titulo}</h3>
                <p class="text-slate-600 text-sm mb-6 line-clamp-3 flex-grow">${extracto}</p>
                <a href="detalle.html?id=${id}" class="inline-flex items-center gap-1.5 text-blue-600 hover:text-blue-800 text-sm font-semibold mt-auto">Leer más →</a>
              </div>
            </article>
          `;
        }).join('');
      } catch (err) {
        grid.innerHTML = '<p class="col-span-3 text-center text-red-500">Error al cargar comunicados.</p>';
      }
    }
    cargarTodos();
  </script>
</body>
</html>
